<!doctype html>
<html class="dark" lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Request a Validation Test | BrandSandbox</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
        <script>
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        colors: {
                            background: "#09090b",
                            surface: "#0c0c0f",
                            "surface-container": "#121215",
                            "on-surface": "#fafafa",
                            "on-surface-variant": "#a1a1aa",
                            primary: "#a78bfa",
                            "on-primary": "#0a0012",
                            outline: "#52525b",
                        },
                        fontFamily: { body: ["Geist"] },
                    },
                },
            };
        </script>
    </head>
    <body class="bg-surface font-body text-on-surface">
        <main class="p-5 sm:p-7">
            <p class="mb-6 text-sm leading-6 text-on-surface-variant">Tell us a little about what you want to validate. We’ll use this to scope the right test.</p>
            <form id="request-test-form" class="space-y-5">
                <div class="grid gap-5 sm:grid-cols-2">
                    <label class="block text-sm font-medium">
                        Name
                        <input name="name" type="text" autocomplete="name" required class="mt-2 block w-full rounded-lg border-outline bg-background text-on-surface focus:border-primary focus:ring-primary" />
                    </label>
                    <label class="block text-sm font-medium">
                        Work email
                        <input name="email" type="email" autocomplete="email" required class="mt-2 block w-full rounded-lg border-outline bg-background text-on-surface focus:border-primary focus:ring-primary" />
                    </label>
                </div>
                <div class="grid gap-5 sm:grid-cols-2">
                    <label class="block text-sm font-medium">
                        Company
                        <input name="company" type="text" autocomplete="organization" required class="mt-2 block w-full rounded-lg border-outline bg-background text-on-surface focus:border-primary focus:ring-primary" />
                    </label>
                    <label class="block text-sm font-medium">
                        Website <span class="font-normal text-on-surface-variant">(optional)</span>
                        <input name="website" type="url" autocomplete="url" placeholder="https://" class="mt-2 block w-full rounded-lg border-outline bg-background text-on-surface focus:border-primary focus:ring-primary" />
                    </label>
                </div>
                <label class="block text-sm font-medium">
                    What would you like to validate?
                    <textarea name="testGoal" rows="4" required placeholder="For example: which price point or product concept is most likely to convert?" class="mt-2 block w-full rounded-lg border-outline bg-background text-on-surface placeholder:text-on-surface-variant focus:border-primary focus:ring-primary"></textarea>
                </label>
                <div class="flex items-center justify-between gap-4 pt-1">
                    <p id="form-status" class="text-sm" role="status" aria-live="polite"></p>
                    <button type="submit" class="shrink-0 rounded-lg bg-primary px-5 py-3 text-sm font-bold text-on-primary transition hover:brightness-110 disabled:cursor-not-allowed disabled:opacity-60">Submit request</button>
                </div>
            </form>
        </main>
        <script>
            const form = document.getElementById("request-test-form");
            const status = document.getElementById("form-status");
            const submitButton = form.querySelector('button[type="submit"]');

            form.addEventListener("submit", async (event) => {
                event.preventDefault();
                const fields = Object.fromEntries(new FormData(form).entries());
                submitButton.disabled = true;
                status.textContent = "Submitting your request…";

                try {
                    const response = await fetch("https://api.brandsandbox.comtom.engineering/v1/test", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(fields),
                    });

                    if (!response.ok) throw new Error("Request failed");
                    form.reset();
                    status.className = "text-sm text-emerald-400";
                    status.textContent = "Thanks — your request has been submitted.";
                } catch (error) {
                    status.className = "text-sm text-red-400";
                    status.textContent = "We couldn’t submit your request. Please try again.";
                } finally {
                    submitButton.disabled = false;
                }
            });
        </script>
    </body>
</html>
